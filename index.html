<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>You Found It ✨</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,.10), transparent 28%),
        linear-gradient(145deg, #17171d 0%, #09090c 48%, #000 100%);
    }

    .glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(255, 67, 92, .14);
      filter: blur(85px);
      animation: breathe 4s ease-in-out infinite;
      pointer-events: none;
    }

    .card {
      position: relative;
      width: min(100%, 430px);
      padding: 42px 28px 32px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background: rgba(255,255,255,.055);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      animation: enter .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .gift {
      width: 84px;
      height: 84px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      font-size: 42px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    }

    .eyebrow {
      margin-bottom: 10px;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(32px, 8vw, 46px);
      line-height: 1.03;
      letter-spacing: -.04em;
      margin-bottom: 16px;
    }

    p {
      max-width: 330px;
      margin: 0 auto;
      color: rgba(255,255,255,.68);
      font-size: 16px;
      line-height: 1.65;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 30px;
      padding: 16px 20px;
      border-radius: 16px;
      color: #0a0a0d;
      background: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      transition: transform .2s ease, opacity .2s ease;
      box-shadow: 0 12px 35px rgba(255,255,255,.10);
      -webkit-tap-highlight-color: transparent;
    }

    .button:active {
      transform: scale(.98);
    }

    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: rgba(255,255,255,.35);
    }

    .spark {
      position: fixed;
      color: rgba(255,255,255,.7);
      animation: float 5s ease-in-out infinite;
      pointer-events: none;
    }

    .s1 { top: 14%; left: 13%; animation-delay: -.5s; }
    .s2 { top: 21%; right: 12%; animation-delay: -2s; font-size: 11px; }
    .s3 { bottom: 15%; left: 18%; animation-delay: -3s; font-size: 10px; }
    .s4 { bottom: 20%; right: 16%; animation-delay: -1s; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(22px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes breathe {
      0%,100% { transform: scale(.9); opacity: .65; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes float {
      0%,100% { transform: translateY(0) rotate(0); opacity: .35; }
      50% { transform: translateY(-16px) rotate(20deg); opacity: .85; }
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <span class="spark s1">✦</span>
  <span class="spark s2">✧</span>
  <span class="spark s3">✦</span>
  <span class="spark s4">✧</span>

  <main class="card">
    <div class="gift">🎁</div>
    <div class="eyebrow">A hidden message</div>

    <h1>You found it.</h1>

    <p>
      If you're seeing this, you discovered the little secret hidden inside your gift.
      There is one more surprise waiting for you.
    </p>

    <a class="button" href="surprise.html">Open the surprise ✨</a>

    <div class="hint">Made to be found.</div>
  </main>
</body>
</html>
