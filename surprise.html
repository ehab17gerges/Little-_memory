<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <title>Your Surprise ✨</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100svh;
      padding:
        max(20px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.09), transparent 30%),
        #050507;
    }

    .wrap {
      width: min(100%, 560px);
      animation: enter .7s ease both;
    }

    .top {
      text-align: center;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin-bottom: 9px;
      color: rgba(255,255,255,.45);
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(30px, 8vw, 46px);
      letter-spacing: -.04em;
      line-height: 1.05;
    }

    .video-shell {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.12);
      background: #000;
      box-shadow: 0 24px 80px rgba(0,0,0,.6);
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #000;
    }

    .note {
      margin: 18px auto 0;
      max-width: 500px;
      text-align: center;
      color: rgba(255,255,255,.58);
      font-size: 14px;
      line-height: 1.6;
    }

    .back {
      display: block;
      width: max-content;
      margin: 18px auto 0;
      color: rgba(255,255,255,.42);
      text-decoration: none;
      font-size: 13px;
      padding: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 420px) {
      body {
        padding-left: 14px;
        padding-right: 14px;
      }

      .video-shell {
        border-radius: 18px;
      }

      .note {
        font-size: 13px;
      }
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header class="top">
      <div class="eyebrow">Just for you</div>
      <h1>Here is your surprise.</h1>
    </header>

    <section class="video-shell">
      <!--
        Upload your 1080 x 1080 MP4 video in the SAME GitHub folder.
        Name it exactly: video.mp4
      -->
      <video controls playsinline preload="metadata">
        <source src="compressed 2.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.
      </video>
    </section>

    <p class="note">
      Some gifts are meant to be opened. This one was meant to be discovered.
    </p>

    <a class="back" href="index.html">← Back</a>
  </main>
</body>
</html>
